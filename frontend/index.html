    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            document.documentElement.classList.remove('darkmode');

    <style>
      /* Inline critical styles for premium splash screen */
      #premium-splash-wrapper {
        position: fixed;
        inset: 0;
        background-color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        opacity: 1;
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
        transform: translateZ(0);
        will-change: opacity;
        backface-visibility: hidden;
      }
      .logo-container {
        position: relative;
        width: 250px;
        height: 250px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateZ(0);
        will-change: transform;
      }
      .splash-logo-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        transform-origin: 100px 100px;
        animation: soft-pulse 0.2s ease-in-out 0.8s forwards, pulse-loop-active 2s infinite ease-in-out 1s;
        will-change: transform;
      }
      .center-init-glow {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #00f3ff;
        box-shadow: 0 0 15px 4px #00f3ff, 0 0 30px 8px rgba(0, 243, 255, 0.4);
        transform: scale(0);
        opacity: 0;
        animation: init-glow 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes init-glow {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(2); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
      }
      .ring-circle {
        stroke-dasharray: 440;
        stroke-dashoffset: 440;
        transform-origin: 100px 100px;
        animation: draw-ring 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards,
                   ring-spin-pulse 0.3s cubic-bezier(0.25, 1, 0.5, 1) 0.65s forwards;
        will-change: stroke-dashoffset, transform;
      }
      @keyframes draw-ring {
        to { stroke-dashoffset: 0; }
      }
      @keyframes ring-spin-pulse {
        0% { transform: rotate(0deg); }
        50% { stroke: #00f3ff; }
        100% { transform: rotate(360deg); }
      }
      .crown-path {
        transform-origin: 100px 66px;
        transform: scale(0);
        opacity: 0;
        animation: crown-pop-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
        will-change: transform, opacity;
      }
      @keyframes crown-pop-in {
        0% { transform: scale(0); opacity: 0; }
        70% { transform: scale(1.1); opacity: 0.9; }
        100% { transform: scale(1); opacity: 1; }
      }
      .eyes-group {
        opacity: 0;
        animation: eyes-fade-in 0.15s ease-out 0.3s forwards;
      }
      .eye-left, .eye-right {
        transform-origin: 85px 98px;
        animation: eye-blink-cycle 3s infinite 0.5s;
        will-change: transform;
      }
      .eye-right {
        transform-origin: 115px 98px;
      }
      @keyframes eyes-fade-in {
        to { opacity: 1; }
      }
      @keyframes eye-blink-cycle {
        0%, 90%, 94%, 98%, 100% { transform: scaleY(1); }
        92%, 96% { transform: scaleY(0.1); }
      }
      .text-brand-tauhid {
        opacity: 0;
        transform: translateX(-30px);
        animation: text-slide-l 0.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        will-change: transform, opacity;
      }
      .text-brand-shekhar {
        opacity: 0;
        transform: translateX(30px);
        animation: text-slide-r 0.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        will-change: transform, opacity;
      }
      @keyframes text-slide-l {
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes text-slide-r {
        to { transform: translateX(0); opacity: 1; }
      }
      .dot-l, .dot-c, .dot-r {
        opacity: 0;
        transform-origin: 100px 154px;
        will-change: transform, opacity;
      }
      .dot-l { animation: dot-pop-bounce 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s forwards; }
      .dot-c { animation: dot-pop-bounce 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.58s forwards; }
      .dot-r { animation: dot-pop-bounce 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.61s forwards; }
      @keyframes dot-pop-bounce {

        60% { transform: translateY(-4px) scale(1.1); opacity: 0.9; }

        transform-origin: 100px 100px;
        opacity: 0;
        animation: glow-sweep-spin 0.3s cubic-bezier(0.25, 1, 0.5, 1) 0.65s forwards;
        will-change: transform, stroke-dashoffset, opacity;
      }

    <!-- Script to execute loading and transition logic -->
    <script>
      (function() {
        var splash = document.getElementById('premium-splash-wrapper');
        if (!splash) return;

        // Skip if splash has already played in this browser session
        try {
          if (sessionStorage.getItem('splash-played') === 'true') {
            splash.style.display = 'none';
            splash.remove();
            return;
          }
        } catch (_) {}
        
        var minDuration = 800; // 800ms min duration (fast and premium feel)
        var startTime = Date.now();
        var isPageLoaded = false;

        function endSplash() {
          var elapsed = Date.now() - startTime;
          var remaining = Math.max(0, minDuration - elapsed);

          setTimeout(function() {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            try {
              sessionStorage.setItem('splash-played', 'true');
            } catch (_) {}
            setTimeout(function() {
              splash.remove();
            }, 400);
          }, remaining);
        }

        window.addEventListener('load', function() {
          isPageLoaded = true;
          endSplash();
        });

        // Safety backup end in 5s
        setTimeout(function() {
          if (document.getElementById('premium-splash-wrapper')) {
            isPageLoaded = true;
            endSplash();
          }
        }, 5000);
      })();
    </script>

    <script>
      // Purge any previously active Service Workers & trigger a single self-healing reload if controlled
      if ('serviceWorker' in navigator) {
        if (navigator.serviceWorker.controller) {
          console.warn('Cached ServiceWorker detected. Purging cache and reloading once...');
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister();
            }
          }).then(() => {
            if ('caches' in window) {
              caches.keys().then((names) => {
                Promise.all(names.map(name => caches.delete(name))).then(() => {
                  window.location.reload();
                });
              });
            } else {
              window.location.reload();
            }
          });
        } else {
          // Keep background unregistration active to clean up any inactive workers
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        }
      }
    </script>
