    <title>Tauhid Shekhar | Creative Full Stack Portfolio</title>

    <!-- Instant theme loading to prevent style flicker on reload & navigation -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark', 'darkmode');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark', 'darkmode');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Wake up the backend serverless instance in background -->
    <script>
      (function() {
        try {
          var backendUrl = 'https://tauhid-shekhar-portfolio.onrender.com/api/health';
          fetch(backendUrl, { mode: 'no-cors' }).catch(function() {});
