    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;850&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <title>Tauhid Shekhar | Creative Full Stack Portfolio</title>
    <!-- Instant theme loading to prevent style flicker on reload -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
            document.documentElement.classList.add('darkmode');
            document.body.classList.add('darkmode');
          } else {
            document.documentElement.classList.remove('darkmode');
            document.body.classList.remove('darkmode');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- High-fidelity inline styled loading screen that renders instantly -->
      <div style="min-height: 100vh; background-color: #09090c; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #a1a1a6;">
        <div style="width: 48px; height: 48px; border-radius: 50%; border: 4px solid rgba(134, 59, 251, 0.2); border-top-color: #863bfb; animation: spin 1s linear infinite;"></div>
        <span style="font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em; animation: pulse 1.5s ease-in-out infinite;">Loading Platform...</span>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
