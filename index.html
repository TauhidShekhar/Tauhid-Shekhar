    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;850&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <title>Tauhid Shekhar | Creative Full Stack Portfolio</title>
    <!-- Instant theme loading to prevent style flicker on reload -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
            document.documentElement.classList.add('darkmode');
            document.body.classList.add('darkmode');
          } else {
            document.documentElement.classList.remove('darkmode');
            document.body.classList.remove('darkmode');
          }
        } catch (e) {}
      })();
    <!-- Wake up the backend serverless instance as early as possible -->
    <script>
      (function() {
        try {
          var backendUrl = 'https://tauhid-shekhar-portfolio.onrender.com/api/health';
          fetch(backendUrl, { mode: 'no-cors' }).catch(function() {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- High-fidelity inline styled logo loading screen that renders instantly -->
      <div id="instant-loader" style="position: fixed; inset: 0; background-color: #090909; display: flex; align-items: center; justify-content: center; z-index: 999999;">
        <div style="position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center;">
          <!-- Spinning Progress Ring -->
          <div style="position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 3px solid transparent; border-top: 3px solid #a855f7; border-bottom: 3px solid #3b82f6; animation: spin-loader-spin 1.8s cubic-bezier(0.53, 0.21, 0.29, 0.67) infinite; filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.4)) drop-shadow(0 0 15px rgba(59, 130, 246, 0.3));"></div>
          <!-- Hexagon Logo -->
          <div style="position: absolute; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; animation: spin-logo-bounce 2.2s ease-in-out infinite;">
            <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.5));">
              <defs>
                <linearGradient id="inlineLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#a855f7" />
                  <stop offset="100%" stop-color="#3b82f6" />
                </linearGradient>
              </defs>
              <polygon points="50,15 82,33.5 82,66.5 50,85 18,66.5 18,33.5" fill="none" stroke="url(#inlineLogoGrad)" stroke-width="4" style="stroke-dasharray: 300; stroke-dashoffset: 0;" />
              <path d="M38,36 H62 M50,36 V64 M40,64 H60 M38,48 H48" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />
            </svg>
          </div>
        </div>
        <style>
          @keyframes spin-loader-spin {
            to { transform: rotate(360deg); }
          }
          @keyframes spin-logo-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08) rotate(3deg); }
          }
        </style>
      </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
