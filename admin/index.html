<!DOCTYPE html>
<html lang="en" class="darkmode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tauhid Shekhar - Admin CMS Panel" />
    <meta name="author" content="Tauhid Shekhar" />
    
    <!-- PWA Theme Meta -->
    <meta name="theme-color" content="#0071e3" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assits/tauhidshekhar.png" />
    <link rel="icon" type="image/x-icon" href="/assits/tauhidshekhar.png" />

    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;850&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <title>Tauhid Shekhar | Admin CMS Panel</title>
    <!-- Instant theme loading -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
            document.documentElement.classList.add('darkmode');
          } else {
            document.documentElement.classList.remove('darkmode');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="darkmode">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
