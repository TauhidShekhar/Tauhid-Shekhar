<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assits/tauhidshekhar.png">
    <title>404 - Page Not Found | Tauhid Shekhar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            margin: 0;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        .error-container {
            max-width: 500px;
            padding: 2rem;
            z-index: 10;
        }
        h1 {
            font-size: 8rem;
            font-weight: 700;
            margin: 0 0 1rem 0;
            background: linear-gradient(135deg, #0071e3, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 4s ease-in-out infinite;
        }
        h2 {
            font-size: 2.4rem;
            font-weight: 600;
            margin: 0 0 1.5rem 0;
        }
        p {
            font-size: 1.6rem;
            color: var(--text-secondary);
            margin: 0 0 3rem 0;
            line-height: 1.5;
            max-width: 100%;
        }
        .btn-home {
            display: inline-block;
            padding: 1.2rem 3rem;
            background: #0071e3;
            color: #ffffff;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1.6rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.4);
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.6);
            background: #0077ed;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="index.html" class="btn-home">Return Home</a>
    </div>
</body>
</html>
